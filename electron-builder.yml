appId: dev.termhop.app
productName: TermHop
copyright: Copyright © 2026 TermHop contributors

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json

asar: true

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TermHop
